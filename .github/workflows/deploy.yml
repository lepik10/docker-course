name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/apps/docker-course
            git pull origin master
            docker compose -f compose.production.yaml build app
            docker compose -f compose.production.yaml up -d
            docker compose -f compose.production.yaml exec app php artisan migrate --force
            
            for i in {1..10}; do
              if curl --fail --silent --show-error http://localhost:8080/api/health; then
                exit 0
              fi

              echo "Health check failed, retrying..."
              sleep 2
            done

            echo "Health check failed after 10 attempts"
            exit 1
name: backend-stack-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env.production

    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine

    ports:
      - "8080:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

  postgres:
    image: postgres:18

    env_file:
      - .env.production

    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8

volumes:
  postgres_data: